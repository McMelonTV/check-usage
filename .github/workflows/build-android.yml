name: Build Android app

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - .github/workflows/build-android.yml

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ai-usage-widgets.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-usage-widgets-debug
          path: android/app/build/outputs/apk/debug/ai-usage-widgets.apk
          if-no-files-found: error
