name: Build Android app

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "internal/providers/**"
      - "mobile/codexlogic/**"
      - go.mod
      - go.sum
      - .github/workflows/build-android.yml
  push:
    branches:
      - main
      - "t3/**"
    paths:
      - "android/**"
      - "internal/providers/**"
      - "mobile/codexlogic/**"
      - go.mod
      - go.sum
      - .github/workflows/build-android.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Go Mobile AAR cache
        id: gomobile-cache
        uses: actions/cache@v4
        with:
          path: android/app/build/generated/go/codexlogic.aar
          key: gomobile-aar-${{ runner.os }}-${{ hashFiles('internal/providers/**', 'mobile/codexlogic/**', 'go.mod', 'go.sum') }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Go
        if: steps.gomobile-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        env:
          CHECK_USAGE_PREBUILT_GOMOBILE_AAR: ${{ steps.gomobile-cache.outputs.cache-hit }}
        run: ./gradlew :app:testDebugUnitTest

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Go Mobile AAR cache
        id: gomobile-cache
        uses: actions/cache@v4
        with:
          path: android/app/build/generated/go/codexlogic.aar
          key: gomobile-aar-${{ runner.os }}-${{ hashFiles('internal/providers/**', 'mobile/codexlogic/**', 'go.mod', 'go.sum') }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Go
        if: steps.gomobile-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        id: signing
        shell: bash
        env:
          CHECK_USAGE_KEYSTORE_BASE64: ${{ secrets.CHECK_USAGE_KEYSTORE_BASE64 }}
          CHECK_USAGE_KEYSTORE_PASSWORD: ${{ secrets.CHECK_USAGE_KEYSTORE_PASSWORD }}
          CHECK_USAGE_KEY_ALIAS: ${{ secrets.CHECK_USAGE_KEY_ALIAS }}
          CHECK_USAGE_KEY_PASSWORD: ${{ secrets.CHECK_USAGE_KEY_PASSWORD }}
        run: |
          if [[ -n "$CHECK_USAGE_KEYSTORE_BASE64" && -n "$CHECK_USAGE_KEYSTORE_PASSWORD" && -n "$CHECK_USAGE_KEY_ALIAS" && -n "$CHECK_USAGE_KEY_PASSWORD" ]]; then
            keystore_path="${RUNNER_TEMP}/check-usage-release.jks"
            printf '%s' "$CHECK_USAGE_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
            chmod 600 "$keystore_path"
            echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APKs
        if: steps.signing.outputs.signed == 'true'
        env:
          CHECK_USAGE_PREBUILT_GOMOBILE_AAR: ${{ steps.gomobile-cache.outputs.cache-hit }}
          CHECK_USAGE_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          CHECK_USAGE_KEYSTORE_PASSWORD: ${{ secrets.CHECK_USAGE_KEYSTORE_PASSWORD }}
          CHECK_USAGE_KEY_ALIAS: ${{ secrets.CHECK_USAGE_KEY_ALIAS }}
          CHECK_USAGE_KEY_PASSWORD: ${{ secrets.CHECK_USAGE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -x lintVitalRelease

      - name: Build debug APKs (unsigned fallback)
        if: steps.signing.outputs.signed != 'true'
        env:
          CHECK_USAGE_PREBUILT_GOMOBILE_AAR: ${{ steps.gomobile-cache.outputs.cache-hit }}
        run: ./gradlew :app:assembleDebug

      - name: Clean up release keystore
        if: always() && steps.signing.outputs.keystore_path != ''
        shell: bash
        run: rm -f "${{ steps.signing.outputs.keystore_path }}"

      - name: Stage universal and per-architecture APKs
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [[ "$SIGNED" == "true" ]]; then
            variant="release"
          else
            variant="debug"
          fi

          source_dir="app/build/outputs/apk/${variant}"
          output_dir="app/build/release-apks"
          rm -rf "$output_dir"
          mkdir -p "$output_dir"

          declare -A apks=(
            ["app-universal-${variant}.apk"]="ai-usage-widgets-universal.apk"
            ["app-arm64-v8a-${variant}.apk"]="ai-usage-widgets-arm64-v8a.apk"
            ["app-armeabi-v7a-${variant}.apk"]="ai-usage-widgets-armeabi-v7a.apk"
            ["app-x86_64-${variant}.apk"]="ai-usage-widgets-x86_64.apk"
            ["app-x86-${variant}.apk"]="ai-usage-widgets-x86.apk"
          )

          for source_name in "${!apks[@]}"; do
            test -f "$source_dir/$source_name"
            cp "$source_dir/$source_name" "$output_dir/${apks[$source_name]}"
          done

          (
            cd "$output_dir"
            sha256sum ./*.apk > ai-usage-widgets-SHA256SUMS.txt
          )

          ls -lh "$output_dir"

      - name: Upload signed release APKs
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-usage-widgets-release
          path: android/app/build/release-apks/*
          if-no-files-found: error

      - name: Upload debug APKs
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-usage-widgets-debug
          path: android/app/build/release-apks/*
          if-no-files-found: error
