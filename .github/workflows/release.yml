name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark this as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test CLI
        run: go test ./...

      - name: Build and package CLI release archives
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets_dir="$PWD/release-assets"
          mkdir -p "$assets_dir"
          ldflags="-s -w -X github.com/McMelonTV/check-usage/internal/cli.Version=${TAG} -X github.com/McMelonTV/check-usage/internal/cli.Commit=${GITHUB_SHA}"

          targets=(
            "linux amd64 check-usage-linux-amd64.tar.gz"
            "linux arm64 check-usage-linux-arm64.tar.gz"
            "windows amd64 check-usage-windows-amd64.zip"
            "windows arm64 check-usage-windows-arm64.zip"
            "darwin amd64 check-usage-macos-amd64.tar.gz"
            "darwin arm64 check-usage-macos-arm64.tar.gz"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch archive <<< "$target"
            stage=$(mktemp -d)
            if [[ "$goos" == "windows" ]]; then
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="$ldflags" -o "$stage/check-usage.exe" .
              cp "$stage/check-usage.exe" "$stage/cu.exe"
              (cd "$stage" && zip -q "$assets_dir/$archive" check-usage.exe cu.exe)
            else
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="$ldflags" -o "$stage/check-usage" .
              ln -s check-usage "$stage/cu"
              tar -C "$stage" -czf "$assets_dir/$archive" check-usage cu
            fi
            rm -rf "$stage"
          done

          (
            cd "$assets_dir"
            sha256sum check-usage-*.tar.gz check-usage-*.zip > check-usage-SHA256SUMS.txt
            sha256sum -c check-usage-SHA256SUMS.txt
          )

      - name: Find latest successful Android build
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          android_run=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build-android.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [[ -z "$android_run" ]]; then
            echo "A successful Android build must exist on main." >&2
            exit 1
          fi

          echo "android_run=$android_run" >> "$GITHUB_OUTPUT"
          echo "Using Android build run $android_run" >> "$GITHUB_STEP_SUMMARY"

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: ai-usage-widgets-release
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.builds.outputs.android_run }}

      - name: Verify Android release assets
        shell: bash
        run: |
          expected_apks=(
            ai-usage-widgets-universal.apk
            ai-usage-widgets-arm64-v8a.apk
            ai-usage-widgets-armeabi-v7a.apk
            ai-usage-widgets-x86_64.apk
            ai-usage-widgets-x86.apk
          )

          for apk in "${expected_apks[@]}"; do
            test -f "release-assets/$apk"
          done

          test -f release-assets/ai-usage-widgets-SHA256SUMS.txt
          (
            cd release-assets
            sha256sum -c ai-usage-widgets-SHA256SUMS.txt
          )

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" release-assets/* "${args[@]}"
