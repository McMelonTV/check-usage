name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark this as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Find latest successful builds
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cli_run=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build-cli.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          android_run=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build-android.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [[ -z "$cli_run" || -z "$android_run" ]]; then
            echo "A successful CLI and Android build must exist on main." >&2
            exit 1
          fi

          echo "cli_run=$cli_run" >> "$GITHUB_OUTPUT"
          echo "android_run=$android_run" >> "$GITHUB_OUTPUT"
          {
            echo "Using CLI build run $cli_run"
            echo "Using Android build run $android_run"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download CLI binaries
        uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.builds.outputs.cli_run }}

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: ai-usage-widgets-debug
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.builds.outputs.android_run }}

      - name: Verify Android release assets
        shell: bash
        run: |
          expected_apks=(
            ai-usage-widgets-universal.apk
            ai-usage-widgets-arm64-v8a.apk
            ai-usage-widgets-armeabi-v7a.apk
            ai-usage-widgets-x86_64.apk
            ai-usage-widgets-x86.apk
          )

          for apk in "${expected_apks[@]}"; do
            test -f "release-assets/$apk"
          done

          test -f release-assets/ai-usage-widgets-SHA256SUMS.txt
          (
            cd release-assets
            sha256sum -c ai-usage-widgets-SHA256SUMS.txt
          )

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" release-assets/* "${args[@]}"
