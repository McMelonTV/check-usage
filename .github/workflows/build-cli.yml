name: Build CLI

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/build-cli.yml
  push:
    branches:
      - main
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/build-cli.yml

permissions:
  contents: read

jobs:
  build:
    name: Build all platforms
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          dist_dir="$PWD/dist"
          mkdir -p "$dist_dir"
          ldflags="-s -w -X github.com/McMelonTV/check-usage/internal/cli.Commit=${GITHUB_SHA}"

          targets=(
            "linux amd64 check-usage-linux-amd64.tar.gz"
            "linux arm64 check-usage-linux-arm64.tar.gz"
            "windows amd64 check-usage-windows-amd64.zip"
            "windows arm64 check-usage-windows-arm64.zip"
            "darwin amd64 check-usage-macos-amd64.tar.gz"
            "darwin arm64 check-usage-macos-arm64.tar.gz"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch archive <<< "$target"
            stage=$(mktemp -d)
            if [[ "$goos" == "windows" ]]; then
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="$ldflags" -o "$stage/check-usage.exe" .
              cp "$stage/check-usage.exe" "$stage/cu.exe"
              (cd "$stage" && zip -q "$dist_dir/$archive" check-usage.exe cu.exe)
            else
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="$ldflags" -o "$stage/check-usage" .
              ln -s check-usage "$stage/cu"
              tar -C "$stage" -czf "$dist_dir/$archive" check-usage cu
            fi
            rm -rf "$stage"
          done

          (
            cd "$dist_dir"
            sha256sum check-usage-*.tar.gz check-usage-*.zip > check-usage-SHA256SUMS.txt
            sha256sum -c check-usage-SHA256SUMS.txt
          )

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/*
          if-no-files-found: error
